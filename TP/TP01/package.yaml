name:                TP01
version:             1.24.8
author:              "Miguel Montes"
maintainer:          "mmontes@iua.edu.ar"
ghc-options:
- -Wall
- -Wcompat
copyright:           "2018 Miguel Montes"

extra-source-files:
- README.md
- ChangeLog.md

description:         Trabajo Práctico 1

dependencies:
- base >= 4.7 && < 5
- tasty
- tasty-hunit
- tasty-quickcheck
- QuickCheck
- HUnit
- deepseq
- doctest

library:
  source-dirs: src

executables:
  TP01:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - TP01
    when:
    - condition: false
      other-modules: Paths_TP01

tests:
  TP01-test:
    main:                Spec.hs
    source-dirs:         test/unit
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - TP01
    - tasty
    - tasty-hunit
    - tasty-quickcheck
    - QuickCheck
    - HUnit
    - deepseq
  TP01-doctests:
    main:               doctests.hs
    source-dirs:        test/doctest
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - doctest
